# ==========================================
# Serveur HTTP (Port 80)
# ==========================================
server {
    listen 80;
    server_name _; # Accepte n'importe quelle IP/domaine (ex: 192.168.100.10)

    # 1. Racine (/) : Redirection vers WordPress
    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Sous-dossier /phpmyadmin/ : Redirection vers le conteneur phpMyAdmin
    location ^~ /phpmyadmin/ {
        # Le slash à la fin de la ligne suivante est CRUCIAL. 
        # Il indique à Nginx de supprimer "/phpmyadmin/" de l'URL avant de l'envoyer au conteneur.
        proxy_pass http://phpmyadmin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Sous-dossier /symfony/ : Redirection vers ton application métier
    location ^~ /symfony/ {
        proxy_pass http://symfony:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==========================================
# Serveur HTTPS (Port 443) - Objectif Additionnel
# ==========================================
server {
    listen 443 ssl;
    server_name _;

    # Emplacement des certificats générés par ton dossier SSL
    ssl_certificate /etc/nginx/ssl/cert.crt;
    ssl_certificate_key /etc/nginx/ssl/cert.key;

    # Options de sécurité SSL basiques (Recommandé pour ton profil orienté cyber)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # On duplique les règles de routage pour le trafic chiffré
    location / {
        proxy_pass http://wordpress:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /phpmyadmin/ {
        proxy_pass http://phpmyadmin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /symfony/ {
        proxy_pass http://symfony:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}